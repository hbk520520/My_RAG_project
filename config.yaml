# ==========================================
# My_RAG_Project 统一配置文件
# ==========================================

# --- LLM API ---
llm:
  # 没有默认值：缺失时 config_loader 会打 WARNING，调用 LLM 时才会失败
  api_key: "${DEEPSEEK_API_KEY}"
  base_url: "https://api.deepseek.com"
  judge_model: "deepseek-chat"
  backend: "api"               # api/auto use configured API; explicit vllm fails if unavailable
  request_timeout: 30
  transport_retries: 1
  temperature_plan: 0.1
  temperature_extract: 0.1
  temperature_reason: 0.1
  temperature_generate: 0.3
  temperature_judge: 0.0
  max_tokens_default: 2048
  max_tokens_judge: 512

# --- VLLM 自部署推理 (用自己的模型) ---
vllm:
  base_model: "Qwen/Qwen2.5-14B-Instruct"
  gpu_memory_utilization: 0.85
  enable_prefix_caching: true    # VLLM 自动 KV-cache 复用，同一个 system prompt 不重复算
  lora_modules:
    planner: "./saved_loras/planner_lora"
    replanner: "./saved_loras/replanner_grpo"
    extractor: "./saved_loras/extractor_grader_dpo"
    reasoner: "./saved_loras/reasoner_sft"

# --- 向量模型 ---
embedding:
  model_path: "./RAG_data/bge-legal-v1"
  device: "cuda"
  dimension: 1024
  normalize: true

# --- 图引擎 ---
graph:
  model_name: "BAAI/bge-m3"
  use_fp16: true
  embedding_dim: 1024
  alpha_dense: 0.3
  connect_threshold: 0.85
  label_threshold: 0.99
  top_k_search: 50
  degree_threshold: 15

# --- 项目级长期记忆：原文、摘要、来源与向量跨重启保留 ---
long_term_memory:
  enabled: true
  path: ".memory/rag.sqlite"
  project_id: "legal-rag"
  embedding_space_id: "bge-m3-base-v1"  # 更换编码器/LoRA 时必须使用新的空间标识和记忆库

# --- PageIndex 思路的本地文档检索与引用；复用现有存储和模型接缝 ---
pageindex:
  enabled: true
  navigation: "auto"         # 短文直接读；长文有预算导航；无文档时保持向量检索。vector/agent 可显式选择
  max_turns: 4
  max_pages: 8
  max_read_tokens: 6000
  max_structure_tokens: 3000

# --- 检索器（BGE-M3 挂 LoRA，对齐 model/training/train_retriever.py 的产物）---
retriever:
  lora_path: "./saved_loras/retriever_bge_m3"   # 目录不存在时自动退回原始 BGE-M3 权重
  top_k: 5                                       # 每个子任务召回的文档数

# --- 路由分类器 ---
router:
  complex_semantic_threshold: 0.40
  complex_length_threshold: 80
  simple_confidence_floor: 0.10

# --- Kafka ---
kafka:
  # ${VAR:-默认值} —— 容器内由 k8s Deployment 的 KAFKA_BOOTSTRAP 覆盖
  bootstrap_servers: "${KAFKA_BOOTSTRAP:-localhost:9092}"
  topics:
    planner_pending: "topic.planner.pending"
    retriever_pending: "topic.retriever.pending"
    grader_pending: "topic.grader.pending"
    replanner_pending: "topic.replanner.pending"
    reasoner_pending: "topic.reasoner.pending"
  consumer:
    auto_offset_reset: "earliest"
    enable_auto_commit: false
    max_poll_records: 1
    # 各 Worker 的消费组（阶段 2 从代码硬编码迁到配置）
    groups:
      planner: "planner-group"
      retriever: "retriever-group"
      grader: "grader-group"
      replanner: "replanner-group"
      reasoner: "reasoner-group"
  producer:
    acks: "all"
    compression_type: "gzip"
    max_in_flight: 5

# --- Redis ---
redis:
  url: "${REDIS_URL:-redis://localhost:6379}"
  state_expire_seconds: 3600

# --- 语义缓存 ---
cache:
  threshold: 0.98
  engine: "redis"          # "redis" 或 "memory"
  index_name: "legal_semantic_cache"

# --- CHAIN 因果证据：默认接入检索 → 验证 → Grader → 推理 ---
causal_evidence:
  enabled: true               # 显式设 false 可恢复旧流程；CTVF 仍需截止日和目标实体
  calibration_path: null       # 人工标注拟合的 JSON；null 明确表示未校准
  prediction_cutoff: null      # YYYY-MM-DD；预测时必须显式指定
  targets: null                # 优先明确填写目标实体列表；null 只作问题内精确匹配
  d_max: 3
  eta: 5.0
  missing_time_validity: 0.25
  max_chains: 200
  max_expansions: 10000
  min_score: 0.005

# --- 沙箱 ---
sandbox:
  image: "legal-sandbox:v2"
  max_output_bytes: 65536
  mem_limit: "512m"
  cpu_quota: 50000
  network_mode: "none"
  execution_timeout: 10
  max_retries: 3
  idle_cleanup_seconds: 600

# --- 智能体 ---
agent:
  max_recursion_depth: 5
  max_retries_per_task: 2
  wormhole_threshold: 2      # 失败超过此次数触发虫洞

# One host, one leased executor; API and Kafka share this authority.
runtime:
  enabled: true
  path: ".runtime/runs.sqlite"
  pending_topic: "topic.agent.pending"
  result_topic: "topic.agent.result"
  api_token: "${AGENT_API_TOKEN}"

# --- 可观测性 ---
observability:
  log_level: "INFO"
  log_format: "json"         # "json" 或 "text"
  prometheus_port: 9090
  health_check_port: 8080
  # 处理失败的消息落盘位置（阶段 6 接入；Worker 循环捕获未处理异常时写入）
  dlq_path: "./dlq.jsonl"

# --- 训练 ---
training:
  unsloth:
    load_in_4bit: true
    lora_r: 64
    lora_alpha: 128
  planner:
    base_model: "Qwen/Qwen2.5-14B-Instruct"
    epochs: 3
    learning_rate: 2.0e-5
  replanner:
    base_model: "Qwen/Qwen2.5-14B-Instruct"
    epochs: 1
    learning_rate: 1.0e-5
  extractor_grader:
    base_model: "Qwen/Qwen2.5-3B-Instruct"
    epochs: 1
    learning_rate: 5.0e-6
    dpo_beta: 0.1
  reasoner:
    base_model: "Qwen/Qwen2.5-7B-Instruct"
    epochs: 2
    learning_rate: 1.0e-5
  retriever:
    base_model: "BAAI/bge-m3"
    lora_r: 8
    lora_alpha: 16
    epochs: 3
    learning_rate: 2.0e-5
